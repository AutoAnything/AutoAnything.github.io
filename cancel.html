<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled — Pico Macro Builder</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .cancel-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
      }
      .cancel-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 60px;
        max-width: 560px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
      }
      .cancel-icon {
        width: 80px;
        height: 80px;
        background: rgba(248, 113, 113, 0.15);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        font-size: 40px;
      }
      .cancel-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--fg);
      }
      .cancel-desc {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 32px;
      }
      .cancel-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
      }
      .cancel-actions a {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: var(--radius);
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
      }
      .cancel-actions a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="cancel-page">
      <div class="cancel-card">
        <div class="cancel-icon">✕</div>
        <h1 class="cancel-title">Payment Cancelled</h1>
        <p class="cancel-desc">
          Your payment was not completed. No charges were made to your card.
          If you changed your mind, that's totally fine — but if you'd like to
          try again, you can return to the checkout page at any time.
        </p>
        <div class="cancel-actions">
          <a href="index.html#pricing">← Back to Checkout</a>
        </div>
      </div>
    </div>
  </body>
</html>
